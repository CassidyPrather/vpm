name: Build Repo Listing

on:
  workflow_dispatch:
  # Sent by each package repository's release job once its assets are up
  # (the "Rebuild the VPM listing" step in its ci-cd.yml).
  repository_dispatch:
    types: [package-released]
  push:
    branches: main
    paths:
      - source.json
      - build-listing.py
      - .github/workflows/build-listing.yml

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  build-listing:
    name: build-listing
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      # Writes publish/listing.json, the entire contents of the site.
      - name: Build listing
        run: python3 build-listing.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish

  # A job of its own, as GitHub's Pages workflows have it: deploying from the
  # job that uploaded the artifact stopped finding it ("No artifacts named
  # github-pages were found"), since an artifact is only reliably there for
  # another job once the one that made it has ended.
  deploy:
    name: deploy
    needs: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
